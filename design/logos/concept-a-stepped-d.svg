<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256" role="img" aria-labelledby="title-c1">
  <title id="title-c1">DownSort — Concept A: Stepped D</title>
  <g id="symbol">
    <!-- Left vertical anchor spine -->
    <rect x="36" y="36" width="38" height="184" rx="10" fill="#161412" />
    <!-- Three descending sorting bars forming the letter D -->
    <!-- Top tier: wide bar with outer curve -->
    <rect x="90" y="36" width="130" height="48" rx="14" fill="#161412" />
    <!-- Middle tier: medium bar -->
    <rect x="90" y="104" width="98" height="48" rx="14" fill="#161412" />
    <!-- Bottom tier: compact anchor bar -->
    <rect x="90" y="172" width="66" height="48" rx="14" fill="#161412" />
  </g>
</svg>