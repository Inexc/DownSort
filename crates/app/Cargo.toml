[package]
name = "app"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "downsort"
path = "src/main.rs"

[dependencies]
core = { path = "../core" }
gpui = "0.2.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Gdi",
    "Win32_Media",
    "Win32_System_Performance",
    "Win32_UI_Shell",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(windows)'.build-dependencies]
embed-resource = "3.0"
